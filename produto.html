<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto | bolosdabeth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .product-detail { min-height: calc(100vh - 82px); display: grid; place-items: center; padding: 70px 0; }
    .detail-card { width: min(940px, 100%); display: grid; grid-template-columns: 1fr 1fr; gap: 55px; align-items: center; background: var(--paper); padding: 25px; box-shadow: var(--shadow); }
    .detail-image { width: 100%; height: 440px; object-fit: cover; }
    .header-contacts { display: flex; gap: 16px; margin-left: auto; color: var(--rose-dark); font-size: 11px; font-weight: 700; }
    .header-contacts a:hover { color: var(--rose); }
    .detail-copy { padding: 20px; }.detail-copy h1 { font-size: 46px; margin-bottom: 15px; }.detail-description { max-width: 380px; color: var(--muted); font-size: 14px; line-height: 1.8; margin-bottom: 25px; }
    .detail-price { display: block; color: var(--rose-dark); font-size: 25px; margin-bottom: 25px; }
    .order-note { max-width: 380px; padding: 12px 14px; border-left: 2px solid var(--rose); color: var(--muted); background: var(--blush); font-size: 11px; line-height: 1.5; }
    .detail-actions { display: grid; gap: 10px; max-width: 380px; }.detail-actions .primary-button, .secondary-button { width: 100%; justify-content: space-between; }.secondary-button { display: inline-flex; align-items: center; justify-content: space-between; gap: 28px; border: 1px solid var(--rose); border-radius: 3px; color: var(--rose-dark); background: transparent; padding: 14px 20px; font-size: 12px; font-weight: 700; }.secondary-button:hover { color: #fff; background: var(--rose); }
    .back-link { display: inline-flex; gap: 10px; color: var(--rose-dark); font-size: 12px; font-weight: 700; margin-bottom: 30px; }
    .detail-message { min-height: 20px; color: var(--rose-dark); font-size: 12px; margin-top: 15px; }
    @media (max-width: 700px) { .product-detail { min-height: calc(100vh - 64px); padding: 28px 0 42px; }.detail-card { grid-template-columns: 1fr; gap: 4px; padding: 14px; }.detail-image { height: min(58vw, 240px); }.detail-copy { padding: 18px 8px 8px; }.detail-copy h1 { font-size: 35px; line-height: 1; }.detail-description { font-size: 13px; line-height: 1.65; margin-bottom: 18px; }.detail-price { font-size: 23px; margin-bottom: 18px; }.order-note { margin-bottom: 20px; }.detail-actions { max-width: none; }.detail-actions a, .detail-actions button { min-height: 48px; }.header-contacts { gap: 8px; font-size: 9px; }.header-inner > .text-link { font-size: 11px; white-space: nowrap; }.header-inner > .text-link { border-bottom: 0; padding-bottom: 0; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Voltar ao cardápio">
        <span class="brand-mark">bd</span>
        <span class="brand-copy"><strong>bolosdabeth</strong><small>biscoitos e bolos artesanais</small></span>
      </a>
      <a class="text-link" href="index.html">← Voltar ao cardápio</a>
    </div>
  </header>
  <main class="product-detail">
    <article class="detail-card">
      <img class="detail-image" id="detailImage" alt="">
      <div class="detail-copy">
        <p class="eyebrow">feito sob encomenda</p>
        <h1 id="detailName"></h1>
        <p class="detail-description" id="detailDescription"></p>
        <strong class="detail-price" id="detailPrice"></strong>
        <p class="order-note">Produção exclusiva sob encomenda. Consulte o prazo pelo WhatsApp.</p>
        <div class="detail-actions">
          <button class="primary-button" id="detailCheckout" type="button">Finalizar pedido <span>→</span></button>
          <button class="primary-button" id="detailAdd" type="button">Adicionar ao carrinho <span>+</span></button>
        </div>
        <p class="detail-message" id="detailMessage" aria-live="polite"></p>
      </div>
    </article>
  </main>
  <script src="produto.js"></script>
</body>
</html>
